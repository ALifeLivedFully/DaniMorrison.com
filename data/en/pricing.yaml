
currency: $
period: /month
plans:
  - badge: supporter
    title: Friend
    description: Help keep my independent projects and resources going with a small monthly contribution.
    price: 3
    features:
      - Support my ongoing work
      - Help fund future projects
      - Access to public resources
      - Cancel anytime
    cta:
      title: Become a supporter
      link: /support/
      style: ghost

  - badge: most popular
    title: Sustainer
    description: Provide steady support that helps me spend more time building, documenting, and sharing projects.
    price: 7
    featured: true
    features:
      - Everything in Friend
      - Project progress updates
      - Behind-the-scenes posts
      - Early access to selected work
    cta:
      title: Become a sustainer
      link: /support/

  - badge: patron
    title: Benefactor
    description: Make a bigger contribution toward independent work, practical resources, and community-focused projects.
    price: 15
    features:
      - Everything in Sustainer
      - Detailed project notes
      - Input on future project ideas
      - My sincere appreciation
    cta:
      title: Become a benefactor
      link: /support/
      style: ghost

