# Defaults for the `listing` shortcode — what every option does when a call
# leaves it out. Override any of them per call:
#
#     {{< listing folder="jobs" dates="true" style="tiles" limit="3" >}}
#
# `folder` is the one option with no default here: it names the content
# directory to list, and every call has to give one.

# Show each entry's date, or its `date`–`enddate` range.
dates: false

# The look of the grid: `cards` (the teaser card) or `tiles` (`gallery` is an
# alias for `tiles`).
style: cards

# Show the tag filter above the grid.
filter: true

# Show each card's own tag chips. Off by default: the tag filter narrows the
# list, but the cards keep their tags to themselves. Set `show-tags="true"` on a
# call to bring the chips back.
show_tags: false

# How many cards to show at once; the rest wait behind a "load more" button.
# 0 shows every card and no button.
limit: 0

# The order the grid opens in, and adds a sort `<select>`:
# newest | oldest | az | length. Empty adds no control and keeps title order.
sort: ""

# Add a search box that narrows the cards as you type.
search: false
