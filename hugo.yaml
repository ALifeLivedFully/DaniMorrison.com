baseURL: https://danimorrison.com
defaultContentLanguage: en

# The stylesheet is authored under `static/css/`, so that is where Hugo Pipes
# looks for it as well as where the files are served from.
assetDir: static

languages:
  en:
    locale: en
    label: English
    contentDir: content/en
    weight: 1
  nl:
    locale: nl
    label: Nederlands
    contentDir: content/nl
    weight: 2
  de:
    locale: de
    label: Deutsch
    contentDir: content/de
    weight: 3
  cs:
    locale: cs
    label: Čeština
    contentDir: content/cs
    weight: 4
  ko:
    locale: ko
    label: 한국어
    contentDir: content/ko
    weight: 5

