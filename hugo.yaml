markup:
  goldmark:
    renderer:
      unsafe: true

disableKinds:
  - taxonomy
  - term

mediaTypes:
  application/javascript:
    suffixes:
      - js

outputs:
  home:
    - html
    - rss
    # `json` renders layouts/home.json, the page lookup the Usecue CMS uses
    # for instant publishing.
    - json
    # `searchindex` renders layouts/home.searchindex.json: one flat JSON
    # array per language, which `js/search.js` fetches on the first keystroke
    # and filters in the browser. No service, no build step, no tracking.
    - searchindex

# The index format behind client-side search. `baseName` keeps it out of the
# way of the `index.json` the Usecue CMS reads, and `isPlainText` stops Hugo
# HTML-escaping the JSON it hands to the browser.
outputFormats:
  json:
    mediaType: application/javascript
    baseName: index
    isPlainText: true
    notAlternative: true
  searchindex:
    mediaType: application/json
    baseName: searchindex
    isPlainText: true
    notAlternative: true
