    # The portfolio, the resume and the blog come before `cta`, because `cta`
    # (`has: a.button:last-child`, `is: :last-child`) matches any listing
    # whose last card ends on a "Read more" button — a grid of projects,
    # jobs or services would collapse into a call to action otherwise. These
    # listings win first, so the cta is only ever the page's own call to
    # action.
    - title: projects
      has: ul.projects
      not_has:
      is:
      not_is:
    - title: posts
      has: ul.posts
      not_has:
      is:
      not_is:
    - title: cta
      has: a.button:last-child
      not_has: img.map
      is: :last-child
      not_is:
    - title: features
      has: ul.features
      not_has:
      is:
      not_is:
    - title: team
