#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "danimorrison.com"
revision = "1.0"

[profiles.production]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for deploying the shop worker and applying D1 migrations (Workers Scripts:Edit, D1:Edit)", required = true, providers = ["keyring", "env"] }
STRIPE_SECRET_KEY = { description = "Stripe LIVE-mode secret API key used by the shop worker to create Checkout sessions (sk_live_...)", required = false, providers = ["keyring", "env"] }
STRIPE_WEBHOOK_SECRET = { description = "Stripe LIVE-mode webhook signing secret for the shop worker's /webhook endpoint (whsec_... registered in live mode)", required = false, providers = ["keyring", "env"] }

[profiles.staging]
CLOUDFLARE_API_TOKEN = { description = "Reuses the production keyring entry: staging still deploys the same worker and database, only the Stripe values differ", required = false, providers = ["keyring"], ref = { item = "secretspec/danimorrison.com/production/CLOUDFLARE_API_TOKEN" } }
STRIPE_SECRET_KEY = { description = "Stripe TEST-mode secret API key for integration checks (sk_test_...; cannot charge real cards)", required = false, providers = ["keyring", "env"] }
STRIPE_WEBHOOK_SECRET = { description = "Stripe TEST-mode webhook signing secret (whsec_... registered in test mode)", required = false, providers = ["keyring", "env"] }
