#:schema https://secretspec.dev/schema/secretspec.schema.json

[project]
name = "danimorrison.com"
revision = "1.0"

[profiles.production]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token for deploying the shop worker and applying D1 migrations (Workers Scripts:Edit, D1:Edit)", required = true, providers = ["keyring", "env"] }
STRIPE_SECRET_KEY = { description = "Stripe secret API key used by the shop worker to create Checkout sessions (sk_test_... for testing, sk_live_... for real payments)", required = false, providers = ["keyring", "env"] }
STRIPE_WEBHOOK_SECRET = { description = "Stripe webhook signing secret for the shop worker's /webhook endpoint (whsec_... from the Stripe dashboard)", required = false, providers = ["keyring", "env"] }
