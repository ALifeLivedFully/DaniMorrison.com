{{- /*
  The tag filter over a listing.

  A `<select>` of the tags on offer and an empty `<ul class="tags">` for the
  chips `site.js` builds as tags are picked. The list it narrows is the form's
  next element sibling — the listing's own `<ul>` — which is why every shortcode
  writes this partial immediately before its grid, and why a page may carry
  more than one: `site.js` wires each form to the list that follows it, and the
  `ID` here keeps the `<select>` and its `<label>` apart from a second one.

  A tag no entry carries is offered and disabled rather than hidden — that is
  `site.js` doing what it does everywhere: an option that would leave nothing
  is closed off, not lied about.

  @context {dict} . Tags (slice of names), Label (i18n key), ID (string)
*/ -}}
{{- with .Tags -}}
<form class="filter">
    <label class="sr-only" for="tagfilter-{{ $.ID }}">{{ i18n $.Label }}</label>
    <select id="tagfilter-{{ $.ID }}" data-numbers="{{ hugo.Data.settings.filter_has_numbers }}" data-label-stop="{{ i18n "Stop filtering on" }}">
        <option value="">{{ i18n "Filter tags" }}</option>
        {{- range $name := . -}}<option value="{{ $name }}">{{ $name }}</option>{{- end -}}
    </select>
    <ul class="tags" aria-live="polite"></ul>
</form>
{{- end -}}
