# Decap CMS, wired up for local use.
#
#   1. npx decap-server        # the local backend (writes straight to this repo)
#   2. hugo server             # the site on http://localhost:1313
#   3. open http://localhost:1313/admin/
#
# Without decap-server the admin page loads but cannot save.
# Front matter that is not listed below is left untouched on save.

backend:
  name: git-gateway
  branch: main

local_backend: true

show_preview_links: true

# The editor previews pages at this address, so keep it pointing at `hugo server`.
site_url: http://localhost:1313/

# Uploads land in the site's own static folder and are referenced with the
# URL they get after Hugo publishes them.
media_folder: static/uploads
public_folder: /uploads

collections:
  # ---- site-wide settings plus the per-language data files (data/en/*.yaml) ----
  - name: settings
    label: Settings
    files:
      - name: global
        label: Global switches
        file: data/settings.yaml
        fields:
          - { label: Favicon image, name: favicon_image, widget: string, required: false }
          - label: Favicon
            name: favicon
            widget: object
            fields:
              - { label: PNG asset, name: asset, widget: string, required: false }
              - { label: SVG image, name: svg_image, widget: string, required: false }
              - { label: ICO image, name: ico_image, widget: string, required: false }
              - { label: Apple touch icon title, name: apple_mobile_web_app_title, widget: string, required: false }
              - label: Web manifest
                name: site_webmanifest
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Short name, name: shortname, widget: string }
                  - { label: Theme colour, name: theme_color, widget: string }
                  - { label: Background colour, name: background_color, widget: string }
          - { label: Accent colour, name: color_name, widget: string, required: false, hint: "yellow, red, blue or green — empty for the default" }
          - { label: Sticky header, name: sticky_header, widget: boolean }
          - { label: Dark header, name: dark_header, widget: boolean }
          - { label: Transparent header, name: transparent_header, widget: boolean }
          - { label: Dark footer, name: dark_footer, widget: boolean }
          - { label: Custom cursor, name: customcursor, widget: boolean }
          - { label: Scroll animations, name: intersectionobserver, widget: boolean }
          - { label: Tag counts in the filter, name: filter_has_numbers, widget: boolean }
          - { label: Posts per "load more", name: page_size, widget: number, value_type: int, min: 1 }
          - label: Preheader
            name: preheader
            widget: object
            fields:
              - { label: Show preheader, name: active, widget: boolean }
              - { label: Light style (black text), name: is_light, widget: boolean }
          - { label: Search icon and /search page, name: enable_search, widget: boolean }
          - { label: Dark mode switch, name: enable_darkmode, widget: boolean }
          - { label: Webshop (products, cart, checkout), name: enable_webshop, widget: boolean }

      - name: general
        label: General
        file: data/en/general.yaml
        fields:
          - { label: Site title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Contact details
            name: contact
            widget: object
            fields:
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }

      - name: header
        label: Header
        file: data/en/header.yaml
        fields:
          - { label: Logo image, name: logo_image, widget: image, required: false }
          - { label: Logo subtitle, name: logo_subtitle, widget: string, required: false }
          - { label: Dark header, name: dark_header, widget: boolean, required: false }
          - { label: Mobile view width, name: mobile_view_width, widget: number, value_type: int, required: false }
          - label: Menu items
            name: menuitems
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Link, name: link, widget: string }
              - label: Sub items
                name: items
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Link, name: link, widget: string }
          - label: Call to action
            name: cta
            widget: object
            fields:
              - { label: Active, name: active, widget: boolean }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Link, name: link, widget: string, required: false }
          - { label: Preheader, name: preheader, widget: string, required: false }

      - name: footer
        label: Footer
        file: data/en/footer.yaml
        fields:
          - { label: Logo image, name: logo_image, widget: image, required: false }
          - label: Menu items
            name: menuitems
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Link, name: link, widget: string }
          - label: Social links
            name: socials
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Link, name: link, widget: string }
              - { label: Logo image, name: logo_image, widget: image, required: false }
          - { label: Footer text, name: footer_text, widget: text, required: false }

      - name: contactform
        label: Contact form
        file: data/en/contactform.yaml
        fields:
          - { label: Action, name: action, widget: string }
          - { label: Placeholders, name: placeholders, widget: boolean }
          - label: Fields
            name: fields
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - label: Input type
                name: input_type
                widget: select
                options: [text, email, textarea, checkbox, submit, html]
              - { label: Label, name: label, widget: string }
              - { label: Required, name: required, widget: boolean }

      - name: ctaform
        label: CTA form
        file: data/en/ctaform.yaml
        fields:
          - { label: Action, name: action, widget: string }
          - { label: Placeholders, name: placeholders, widget: boolean }
          - label: Fields
            name: fields
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - label: Input type
                name: input_type
                widget: select
                options: [text, email, textarea, checkbox, submit, html]
              - { label: Label, name: label, widget: string }
              - { label: Required, name: required, widget: boolean }

      - name: newsletterform
        label: Newsletter form
        file: data/en/newsletterform.yaml
        fields:
          - { label: Action, name: action, widget: string }
          - { label: Placeholders, name: placeholders, widget: boolean }
          - label: Fields
            name: fields
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - label: Input type
                name: input_type
                widget: select
                options: [text, email, textarea, checkbox, submit, html]
              - { label: Label, name: label, widget: string }
              - { label: Required, name: required, widget: boolean }

      - name: openinghours
        label: Opening hours
        file: data/en/openinghours.yaml
        fields:
          - label: Monday
            name: mon
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Tuesday
            name: tue
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Wednesday
            name: wed
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Thursday
            name: thu
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Friday
            name: fri
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Saturday
            name: sat
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }
          - label: Sunday
            name: sun
            widget: object
            fields:
              - { label: Start, name: start, widget: string, required: false }
              - { label: End, name: end, widget: string, required: false }

      - name: pricing
        label: Pricing plans
        file: data/en/pricing.yaml
        fields:
          - { label: Currency, name: currency, widget: string }
          - { label: Period, name: period, widget: string }
          - label: Plans
            name: plans
            widget: list
            fields:
              - { label: Badge, name: badge, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Price, name: price, widget: number, value_type: float, min: 0 }
              - { label: Featured, name: featured, widget: boolean, required: false }
              - label: Features
                name: features
                widget: list
                required: false
                field: { label: Feature, name: feature, widget: string }
              - label: Call to action
                name: cta
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Link, name: link, widget: string }
                  - { label: Style, name: style, widget: string, required: false }

      - name: webshop
        label: Webshop
        file: data/en/webshop.yaml
        fields:
          - { label: Cart link, name: cart_link, widget: string, required: false }
          - { label: Checkout link, name: checkout_link, widget: string, required: false }
          - { label: Payment link, name: payment_link, widget: string, required: false }
          - { label: Thank-you link, name: thankyou_link, widget: string, required: false }
          - { label: Products link, name: products_link, widget: string, required: false }
          - { label: Show cart icon, name: show_cart_icon, widget: boolean }
          - { label: Send order to mail, name: send_order_to_mail, widget: string, required: false }
          - { label: Form handler, name: form_handler, widget: string, required: false }
          - { label: POS id, name: pos_id, widget: number, value_type: int, required: false }
          - { label: Currency code, name: currency_code, widget: string, required: false }
          - { label: Currency symbol, name: currency_symbol, widget: string, required: false }
          - label: Currency position
            name: currency_position
            widget: select
            required: false
            default: prefix
            options: [prefix, suffix]
          - { label: Space between symbol and amount, name: currency_space, widget: boolean, required: false, default: false }
          - label: Shipping
            name: shipping
            widget: object
            fields:
              - { label: Active, name: active, widget: boolean }
              - label: Options
                name: options
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Price, name: price, widget: number, value_type: float }
          - label: Custom values
            name: custom_values
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - label: Options
                name: options
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Value, name: value, widget: string }
                  - { label: Price, name: price, widget: number, value_type: float }

  # ---- the same data files, edited as raw YAML text ----
  # `format: yaml-frontmatter` plus a single `body` text field turns each file
  # into one plaintext box. With no `---` front matter in the file, Decap reads
  # the whole file as the body and writes it back verbatim, so nothing is
  # wrapped or reformatted. The field must be named `body`.
  #
  # These entries point at the same paths as the typed Settings files above, so
  # every file can be edited either way; this is the only way to reach
  # faqs/features/people/reviews, which are top-level YAML arrays and cannot be
  # given typed widgets (decap-cms issue #531).
  - name: settings_raw
    label: Settings (raw)
    format: yaml-frontmatter
    editor:
      preview: false
    files:
      - name: global
        label: Global switches
        file: data/settings.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: general
        label: General
        file: data/en/general.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: header
        label: Header
        file: data/en/header.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: footer
        label: Footer
        file: data/en/footer.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: contactform
        label: Contact form
        file: data/en/contactform.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: ctaform
        label: CTA form
        file: data/en/ctaform.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: newsletterform
        label: Newsletter form
        file: data/en/newsletterform.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: openinghours
        label: Opening hours
        file: data/en/openinghours.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: pricing
        label: Pricing plans
        file: data/en/pricing.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: webshop
        label: Webshop
        file: data/en/webshop.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: faqs
        label: FAQs
        file: data/en/faqs.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: features
        label: Features
        file: data/en/features.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: people
        label: People
        file: data/en/people.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }
      - name: reviews
        label: Reviews
        file: data/en/reviews.yaml
        fields:
          - { label: Raw YAML, name: body, widget: text }

  # ---- content/en/* ----
  - name: pages
    label: Pages
    label_singular: Page
    folder: content/en
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: text, hint: "Raw Markdown — attribute lists like (…){:.class}, image bricks and shortcodes are written by hand here" }

  - name: posts
    label: Blog
    label_singular: Post
    folder: content/en/posts
    create: true
    summary: "{{title}} — {{date}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: Image, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: URL alias, name: url, widget: string, required: false, hint: "Optional; sets the pretty permalink" }
      - { label: Exclude from search, name: search, widget: boolean, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: services
    label: Services
    label_singular: Service
    folder: content/en/services
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: URL alias, name: url, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: portfolio
    label: Portfolio
    label_singular: Project
    folder: content/en/projects
    create: true
    nested:
      depth: 100
      meta:
        path:
          display: folder
          index_file: index
          create: index
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Cover image, name: image, widget: image, required: false, hint: "900x500 crop on the card. SVG covers are shown as-is." }
      - { label: One-line description, name: description, widget: string, required: false, hint: "The portfolio card's description" }
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string, hint: "e.g. Website, Source" }
          - { label: URL, name: url, widget: string }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: jobs
    label: Resume
    label_singular: Job
    folder: content/en/jobs
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: products
    label: Products
    label_singular: Product
    folder: content/en/products
    create: true
    summary: "{{title}} — {{variant_type}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Main image, name: image, widget: image, required: false }
      - label: Gallery images
        name: images
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image }
      - label: Variant type
        name: variant_type
        widget: select
        options: ["size", "colour"]
        default: size
      - label: Variants
        name: variants
        widget: list
        fields:
          - { label: Name, name: name, widget: string, hint: "e.g. tall, grande — or default" }
          - { label: Price, name: price, widget: number, value_type: float, min: 0, step: 0.01 }
          - { label: SKU, name: sku, widget: string }
      - { label: Weight (grid order), name: weight, widget: number, value_type: int, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: bricks
    label: Bricks
    label_singular: Brick
    folder: content/en/bricks
    create: true
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }

  # ---- content/en/docs/** (one collection, nested folders shown as a dropdown) ----
  - name: docs
    label: Docs
    label_singular: Doc
    folder: content/en/docs
    create: true
    nested:
      depth: 100
      # Docs keep their pages as flat .md files inside subfolders, with a
      # `_index.md` per folder — Decap's `subfolders: false` layout.
      subfolders: false
      summary: "{{title}}"
    # `meta.path` is a collection-level sibling of `nested` (not nested inside
    # it), and the schema requires `label` + `widget`. `index_file` names the
    # per-folder page, which for these Hugo sections is `_index.md`.
    meta:
      path:
        widget: string
        label: Path
        index_file: _index
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Weight (menu order), name: weight, widget: number, value_type: int, required: false }
      - { label: Body, name: body, widget: markdown }

# Other languages: copy a collection and change its folder, e.g.
#   folder: content/nl/posts
# Local backend writes files straight into those folders the same way.
